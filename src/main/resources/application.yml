spring:
  application:
    name: job-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobagent}
    username: ${SPRING_DATASOURCE_USERNAME:jobagent}
    password: ${SPRING_DATASOURCE_PASSWORD:jobagent}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
